<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F1E8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = null;
          try { t = localStorage.getItem("parallax-theme"); } catch (e) {}
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#0B1220" : "#F5F1E8");
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Pick a place. See its burning seasons over 20+ years on one fair scale. Harmonized MODIS + VIIRS hotspot calendar — NASA Space Apps 2026, by Team Lumos." />
    <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Parallax Fire</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Parallax Fire needs JavaScript.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
