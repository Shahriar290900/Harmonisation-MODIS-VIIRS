<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Parallax Fire">
  <defs>
    <linearGradient id="fire-back" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#991B1B"/><stop offset="0.7" stop-color="#EF4444"/><stop offset="1" stop-color="#FCA5A5"/>
    </linearGradient>
    <linearGradient id="fire-mid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C2410C"/><stop offset="0.6" stop-color="#F97316"/><stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="fire-front" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#B45309"/><stop offset="0.5" stop-color="#EAB308"/><stop offset="1" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Back layer (Parallax offset) -->
    <path d="M22 18 C30 25, 45 35, 45 45 C45 55, 36 60, 32 60 C18 60, 14 48, 20 38 C23 32, 22 28, 22 18 Z" fill="url(#fire-back)" opacity="0.8"/>
    
    <!-- Mid layer (Parallax offset) -->
    <path d="M35 12 C30 20, 15 32, 18 45 C20 53, 26 58, 32 58 C42 58, 48 48, 42 36 C38 29, 39 22, 35 12 Z" fill="url(#fire-mid)" opacity="0.9"/>
    
    <!-- Front layer -->
    <path d="M32 22 C36 29, 41 36, 40 46 C39 52, 35 55, 32 55 C27 55, 23 50, 25 43 C26 38, 28 32, 32 22 Z" fill="url(#fire-front)"/>
  </g>
</svg>
