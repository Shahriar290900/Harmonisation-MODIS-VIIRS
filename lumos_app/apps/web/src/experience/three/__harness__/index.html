<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Three harness</title>
<style>
  html,body{margin:0;height:100%;background:#0B1220;color:#E2E8F0;font:13px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  #ui{position:fixed;top:10px;left:10px;z-index:10;background:rgba(11,18,32,.75);border:1px solid rgba(148,163,184,.25);border-radius:10px;padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:calc(100vw - 40px)}
  #ui input[type=range]{width:140px}
  #fps{font-variant-numeric:tabular-nums;color:#5EEAD4}
  body.shot #ui{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <select id="scene"><option>globe</option><option>pixel</option><option>transition</option></select>
  <select id="q"><option>high</option><option>low</option></select>
  <label>p <input id="p" type="range" min="0" max="1" step="0.01" value="0" /></label>
  <select id="series"><option>all</option><option>aqua</option><option>viirs</option><option>est</option></select>
  <button id="play">play transition</button>
  <span id="fps">– fps</span>
</div>
<script type="module" src="./harness.ts"></script>
</body>
</html>
